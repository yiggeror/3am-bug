<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Patrick Hand";src:url(../fonts/PatrickHand-Regular.ttf)}
@font-face{font-family:"ZCOOL KuaiLe";src:url(../fonts/ZCOOLKuaiLe-Regular.ttf)}
body{margin:0;background:#222}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { DESIGNS } from '../js/human/design.js';
import { drawFront, drawBack, drawSide } from '../js/human/body.js';
import { setBoil } from '../js/draw.js';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
window.render = (arg) => {
  const D = DESIGNS[arg || 'A'];
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#f5efe3'; ctx.fillRect(0,0,1920,1080);
  setBoil(0);
  const draw = (fn, x, y, s, P, o) => { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); fn(ctx, P, D, o); ctx.restore(); };
  draw(drawFront, 330, 760, 7, { face: { mouth: 'smile' } });
  draw(drawBack, 900, 760, 7, {});
  draw(drawSide, 1350, 760, 7, {});
  // heads close
  draw(drawFront, 330, 1780, 16, { face: { eyes: 'wide', mouth: 'o', brow: 0.6 } });
};
await document.fonts.load('40px "Patrick Hand"');
window.__ready = true;
</script></body></html>
