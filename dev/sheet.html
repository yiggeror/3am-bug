<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Patrick Hand";src:url(../fonts/PatrickHand-Regular.ttf)}
@font-face{font-family:"ZCOOL KuaiLe";src:url(../fonts/ZCOOLKuaiLe-Regular.ttf)}
body{margin:0;background:#222}</style></head><body>
<canvas id="c" width="2400" height="1720"></canvas>
<script type="module">
import { DESIGNS } from '../js/human/design.js';
import { drawSheet } from '../js/sheet.js';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
window.render = (arg) => { ctx.setTransform(1,0,0,1,0,0); drawSheet(ctx, DESIGNS[arg || 'A']); };
await Promise.all([document.fonts.load('40px "Patrick Hand"'), document.fonts.load('40px "ZCOOL KuaiLe"', '方案软卫衣')]);
window.__ready = true;
</script></body></html>
