<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Patrick Hand";src:url(../fonts/PatrickHand-Regular.ttf)}
@font-face{font-family:"ZCOOL KuaiLe";src:url(../fonts/ZCOOLKuaiLe-Regular.ttf)}
@font-face{font-family:"JetBrains Mono";src:url(../fonts/JetBrainsMonoNL-Regular.ttf)}
@font-face{font-family:"JetBrains Mono";font-weight:bold;src:url(../fonts/JetBrainsMonoNL-Bold.ttf)}
body{margin:0;background:#111}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { drawCodeWorld, LINES, groundY, charCX } from '../js/codeworld.js';
import { drawCube2 } from '../js/cube2.js';
import { drawBug } from '../js/bug.js';
import { setBoil } from '../js/draw.js';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
window.render = (arg) => {
  const a = JSON.parse(arg || '{}');
  ctx.setTransform(1,0,0,1,0,0); setBoil(a.t || 0);
  const cam = a.cam || { x: 700, y: 1400, zoom: 0.8 };
  drawCodeWorld(ctx, cam, { t: a.t || 1, errorLine: 7, hook: { front: (c) => {
    drawCube2(c, { x: charCX(6), y: groundY(5) + 6, size: 110, lookX: 0.7, ink: '#1a1512' });
    drawBug(c, { x: charCX(24), y: groundY(7) + 6, size: 60, run: 0.2, runAmt: 1 });
  } } });
};
await Promise.all([document.fonts.load('bold 40px "JetBrains Mono"'), document.fonts.load('40px "JetBrains Mono"'), document.fonts.load('40px "ZCOOL KuaiLe"', '购物车合计满减规则')]);
window.__ready = true;
</script></body></html>
